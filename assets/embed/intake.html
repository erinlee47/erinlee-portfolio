<body>
<div class="fit">
<div class="stage" id="stage" role="img" aria-label="AI Assisted Intake Form: the request is ready, opens pre-filled from the email, highlight shows the AI-filled fields and suggestions appear in the field">
  <div class="win" id="win">
    <div class="layer on" id="Llist"><img class="clip" src="intake-ui/list.webp" alt=""><div class="toastCover"></div></div>
    <img class="clip toast" id="toast" src="intake-ui/list.webp" alt="">
    <div class="layer" id="Lhint"><img class="clip" src="intake-ui/hint.webp" alt="">
      <!-- Highlight off: no suggestion hints, and the fields close up the space they used -->
      <div class="noHint" style="top:505px"></div><div class="noHint" style="top:671px"></div>
      <div class="cardFill"></div>
      <img class="clip seg1" src="intake-ui/hint.webp" alt=""><img class="clip seg2" src="intake-ui/hint.webp" alt="">
    </div>
    <div class="layer" id="hl"><img class="clip" src="intake-ui/page.webp" alt=""></div>
    <div class="layer" id="Ldd"><img class="clip" src="intake-ui/dropdown.webp" alt=""><img class="clip cPractice" src="intake-ui/hint.webp" alt=""><img class="clip cProBono" src="intake-ui/page.webp" alt=""><img class="clip cClientLbl" src="intake-ui/page.webp" alt=""><div class="hov" id="hov"></div></div>
    <div class="lawyer" id="lawyer"><span>Larry Lawyer</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A2F3A" stroke-width="1.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></div>
    <div class="noHint gone-hint" id="lawyerHint" style="top:505px"></div>
    <div class="cursor" id="cursor" aria-hidden="true"><span class="ring"></span>
      <svg width="26" height="30" viewBox="0 0 26 30"><path d="M2 2l20 12-9 2-4 9z" fill="#1C1C1F" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
  </div>
</div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const stage = $('stage'), win = $('win'), cursor = $('cursor');
  const W = 1800, H = 1200, WW = 1440, WH = 1024;
  let S = 1;
  function fit() { S = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(-50%, -50%) scale(${S})`; }
  addEventListener('resize', fit); fit();
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function cam(p, z, instant) { if (instant) win.classList.add('nocam');
    win.style.transform = z === 1 ? '' : `translate(${WW / 2 - z * p.x}px, ${WH / 2 - z * p.y}px) scale(${z})`;
    if (instant) { void win.offsetWidth; win.classList.remove('nocam'); } }
  const moveCursor = (x, y) => { cursor.style.transform = `translate(${x}px, ${y}px)`; };
  async function to(x, y) { moveCursor(x, y); await wait(900); }
  async function click() { cursor.classList.remove('click'); void cursor.offsetWidth; cursor.classList.add('click'); await wait(160); }
  const show = (id, on) => $(id).classList.toggle('on', on);

  function reset() {
    stage.classList.add('instant');
    show('Llist', true); show('Lhint', false); $('Lhint').classList.remove('compact'); show('Ldd', false); show('hl', false); show('lawyer', false); show('lawyerHint', false); show('hov', false);
    $('toast').classList.remove('in'); cam(null, 1, true); cursor.style.opacity = 0; moveCursor(1180, 330);
    void stage.offsetWidth; stage.classList.remove('instant');
  }
  async function run() {
    while (true) {
      reset(); stage.classList.remove('fade');
      await wait(900);
      // The email has been read: the request is ready
      $('toast').classList.add('in');
      await wait(700); cursor.style.opacity = 1;
      await to(1338, 90); await click();
      // Open Request #5602, pre-filled and highlighted
      show('Lhint', true); show('hl', true); await wait(450); show('Llist', false); $('toast').classList.remove('in');
      cursor.style.opacity = 0;
      await wait(500);
      cam({ x: 700, y: 560 }, 1.35);
      await wait(1500);
      // Suggestions right in the field
      moveCursor(760, 620); cursor.style.opacity = 1; await wait(200);
      await to(560, 486); await click();
      show('Ldd', true);
      await wait(700);
      await to(200, 556); show('hov', true); await wait(350); await click();
      show('lawyer', true); show('lawyerHint', true); show('Ldd', false); show('hov', false);
      await wait(500); cursor.style.opacity = 0;
      await wait(1400);
      cam(null, 1);
      await wait(2200);
      stage.classList.add('fade'); await wait(600);
    }
  }
  function still() { show('Llist', false); show('Lhint', true); show('hl', true); show('lawyer', true); show('lawyerHint', true); }
  if (reduced) still(); else run();
</script>
</body>
</html>
