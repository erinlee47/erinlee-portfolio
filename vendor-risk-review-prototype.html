<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vendor Risk Review prototype — Erin Lee</title>
<meta name="description" content="Scripted prototype: an AI agent reviews a vendor's security documents, and every finding links to its source.">
<link rel="icon" href="assets/meta/favicon.svg?v=2" type="image/svg+xml">
<style>html,body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --text:#111111; --text2:#555555; --text3:#6B6B6B; --border:#E6E6E6; --panel:#F5F5F5; --chip:#F0F0F0; --chipText:#3F3F3F;
  --purple:#4B3FC0; --lav:#F1EEFE; --lavBorder:#DAD3FB; --link:#2F55D4;
  --green:#1C7A4A; --greenBg:#E7F5ED; --amber:#8F5300; --amberBg:#FFF3DC; --red:#B42318; --redBg:#FDECEA;
  --btn:#111111; --btnText:#FFFFFF; --logo:#111111; --logoIcon:#FFFFFF; --hl:#FFF0B3; --shade:rgba(0,0,0,.3);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#0F0F10; --text:#F2F2F2; --text2:#B5B5B5; --text3:#9C9C9C; --border:#2A2A2D; --panel:#18181A; --chip:#26262A; --chipText:#D6D6D6;
    --purple:#B9B0FF; --lav:#221F3A; --lavBorder:#3B3563; --link:#93AAFF;
    --green:#72D39E; --greenBg:#13261B; --amber:#F2B655; --amberBg:#2A2010; --red:#FF8F85; --redBg:#2D1614;
    --btn:#F2F2F2; --btnText:#111111; --logo:#F2F2F2; --logoIcon:#111111; --hl:#4A3D0C; --shade:rgba(0,0,0,.6); }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0F0F10; --text:#F2F2F2; --text2:#B5B5B5; --text3:#9C9C9C; --border:#2A2A2D; --panel:#18181A; --chip:#26262A; --chipText:#D6D6D6;
  --purple:#B9B0FF; --lav:#221F3A; --lavBorder:#3B3563; --link:#93AAFF;
  --green:#72D39E; --greenBg:#13261B; --amber:#F2B655; --amberBg:#2A2010; --red:#FF8F85; --redBg:#2D1614;
  --btn:#F2F2F2; --btnText:#111111; --logo:#F2F2F2; --logoIcon:#111111; --hl:#4A3D0C; --shade:rgba(0,0,0,.6); }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
svg{flex:none}
.mono{font-family:var(--mono)}

/* rail + top bar */
.rail{position:fixed;left:0;top:0;bottom:0;width:68px;border-right:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;align-items:center;padding-top:16px;z-index:30}
.logo{width:42px;height:42px;border-radius:11px;background:var(--logo);color:var(--logoIcon);display:flex;align-items:center;justify-content:center}
.rail nav{display:flex;flex-direction:column;gap:6px;margin-top:38px}
.rail nav .sp{height:18px}
.ib{width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:var(--text2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ib:hover{background:var(--chip)}
.ib.on{background:var(--chip);color:var(--text)}
.app{margin-left:68px;min-height:100%}
.topbar{height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px}
.crumb{display:flex;align-items:center;gap:10px;font-size:15px;min-width:0}
.crumb a{color:var(--text2);text-decoration:none}
.crumb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .mlogo{display:none}
.tools{display:flex;gap:4px}

.content{max-width:1172px;margin:0 auto;padding:34px 24px 96px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.head h1{font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-.022em}
.head .sub{font-size:16px;color:var(--text2);margin-top:8px}
.hbtns{display:flex;gap:12px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel)}
.btn.lav{background:var(--lav);border-color:var(--lavBorder);color:var(--purple)}
.btn.lav[aria-pressed="true"]{box-shadow:inset 0 0 0 1px var(--purple)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btnText);border-radius:8px}
.btn.pri:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text2);text-decoration:underline;text-underline-offset:3px}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* stepper */
.steps{display:flex;align-items:center;gap:8px;margin-top:26px;overflow-x:auto;padding:2px}
.step{flex:none;display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 15px 0 9px;border:1px solid var(--border);border-radius:999px;font-size:15px;font-weight:500;color:var(--text2)}
.step .num{width:20px;height:20px;border-radius:50%;background:var(--chip);color:var(--text2);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.step.cur{border:1.5px solid var(--text);color:var(--text)}
.step.cur .num{background:var(--text);color:var(--bg)}
.step.past{color:var(--text)}
.step.past .num{background:var(--text);color:var(--bg)}
.conn{flex:none;width:14px;height:1px;background:var(--border)}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;margin-top:24px;align-items:start}
.sech{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.sech h2{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.sech p{font-size:15px;color:var(--text2);line-height:1.55;margin-top:6px;max-width:560px}
.progress{font-size:13px;color:var(--text3);margin-top:8px}
.bar{height:4px;border-radius:2px;background:var(--chip);margin-top:8px;max-width:560px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--text);transition:width .4s}

/* check list */
.checks{list-style:none;margin:22px 0 0;padding:0}
.ck{padding:14px 0 13px}
.ckrow{display:flex;align-items:center;gap:16px}
.ico{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--text3)}
.ico.pass{color:var(--green)} .ico.flag{color:var(--amber)} .ico.judg,.ico.wait,.ico.ruled{color:var(--purple)} .ico.running{color:var(--text)}
.ckname{flex:1;min-width:0;font-size:16px;font-weight:500;line-height:1.4}
.ckname code{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--text3);margin-left:6px;white-space:nowrap}
.ckres{margin:4px 0 0 38px;font-size:14px;color:var(--text2);line-height:1.5}
.ckres .ref{font-family:var(--mono);font-size:12.5px;color:var(--text3)}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;background:var(--chip);color:var(--chipText);font-size:13px;font-weight:600;white-space:nowrap}
.pill.judg{background:var(--lav);color:var(--purple)}
.pill.judg::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.wait{background:var(--purple);color:var(--bg)}
.pill.ruled{background:transparent;color:var(--purple);box-shadow:inset 0 0 0 1px var(--lavBorder)}
.pill.pass{background:var(--greenBg);color:var(--green)}
.pill.flag{background:var(--amberBg);color:var(--amber)}
.pill.running{background:var(--chip);color:var(--text)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* judgment card */
.jcard{margin:14px 0 4px 38px;border:1px solid var(--lavBorder);border-radius:12px;background:var(--bg);overflow:hidden}
.jhead{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--lav)}
.jhead b{display:block;font-size:15px;color:var(--text)}
.jhead span{font-size:14px;color:var(--text2)}
.jhead .ico{color:var(--purple);margin-top:1px}
.jbody{padding:16px;display:grid;gap:14px}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.evc{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:12px 14px;display:grid;gap:6px;align-content:start}
.evc .fn{font-family:var(--mono);font-size:12.5px;color:var(--link);word-break:break-all}
.evc .loc{font-size:12.5px;color:var(--text3)}
.evc q{font-size:14.5px;line-height:1.55;quotes:"“" "”"}
.evc mark{background:var(--hl);color:var(--text);padding:0 2px;border-radius:3px;font-weight:600}
.evc .big{font-size:22px;font-weight:700;letter-spacing:-.01em}
.vs{display:none}
.opts{display:grid;gap:8px}
.opts legend{font-size:14px;font-weight:600;margin-bottom:8px;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.opt{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.opt:hover{background:var(--panel)}
.opt.on{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple)}
.opt input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--purple)}
.opt b{display:block;font-size:14.5px;font-weight:600}
.opt small{display:block;font-size:13px;color:var(--text2);margin-top:2px}
.flbl{font-size:13px;color:var(--text2);font-weight:500}
textarea{width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding:9px 11px;font-size:14px;line-height:1.5;resize:vertical}
textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
.jact{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.jact span{font-size:13px;color:var(--text3)}
.unread{border:1px dashed var(--border);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;background:var(--panel)}
.unread .fn{font-family:var(--mono);font-size:12.5px;color:var(--link);word-break:break-all}
.unread p{font-size:13.5px;color:var(--text2)}

/* summary + decision */
.card{border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-top:20px}
.tierrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tier{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:700}
.tier.High{background:var(--redBg);color:var(--red)} .tier.Medium{background:var(--amberBg);color:var(--amber)} .tier.Low{background:var(--greenBg);color:var(--green)}
.meta{font-size:13px;color:var(--text3)}
.lbl{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:24px 0 10px}
.card > p.sum{font-size:15.5px;line-height:1.65;margin-top:14px;max-width:68ch}
.finds{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.finds li{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.sev{justify-self:start;display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700}
.sev.High{background:var(--redBg);color:var(--red)} .sev.Medium{background:var(--amberBg);color:var(--amber)} .sev.Low{background:var(--chip);color:var(--chipText)}
.finds b{font-weight:600;font-size:15px}
.finds p{font-size:14px;color:var(--text2);margin-top:2px}
.finds .ref{font-family:var(--mono);font-size:12.5px;color:var(--text3);margin-top:4px;display:block}
.plain{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.recbox{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:12px;background:var(--lav);border:1px solid var(--lavBorder);margin-top:20px}
.recbox .ico{color:var(--purple)}
.recbox b{display:block;font-size:15px}
.recbox p{font-size:14px;color:var(--text2);margin-top:3px}
.dbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.confirm{margin-top:16px;padding:16px;border:1px solid var(--border);border-radius:12px;display:grid;gap:10px;background:var(--panel)}
.done{margin-top:20px;border-radius:14px;border:1.5px solid var(--text);padding:20px 22px;display:grid;gap:6px}
.done strong{font-size:18px;font-weight:700}
.done p{font-size:14px;color:var(--text2)}
.edited{font-size:12px;font-weight:600;color:var(--purple);background:var(--lav);padding:3px 8px;border-radius:999px}

/* details panel */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.phead{display:flex;justify-content:space-between;align-items:center;width:100%;padding:18px 24px;border:0;border-bottom:1px solid var(--border);background:transparent;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
.psec{border-bottom:1px solid var(--border)}
.psec:last-child{border-bottom:0}
.psh{display:flex;justify-content:space-between;align-items:center;width:100%;padding:22px 24px 14px;border:0;background:transparent;cursor:pointer;font-size:13.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);text-align:left}
.psb{padding:0 24px 22px}
.vend{display:flex;gap:14px;align-items:flex-start}
.av{width:46px;height:46px;border-radius:9px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.vend b{display:block;font-size:18px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.vend span{font-size:14px;color:var(--text2);line-height:1.35;display:block;margin-top:3px}
.kv{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:12px 12px;font-size:14px}
.kv dt{color:var(--text2)}
.kv dd{margin:0;text-align:right;font-weight:500}
.docs{list-style:none;margin:0;padding:0}
.docs li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.docs li:first-child{padding-top:2px}
.docs li:last-child{border-bottom:0}
.fi{width:28px;height:28px;border-radius:7px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);flex:none}
.docs a{font-family:var(--mono);font-size:14px;color:var(--link);text-decoration:none;word-break:break-all;line-height:1.4}
.docs a:hover{text-decoration:underline}
.docs span{display:block;font-size:14px;color:var(--text2);margin-top:3px}
.docs .warn{color:var(--amber);font-weight:500}
.log{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-height:420px;overflow-y:auto}
.log li{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:13.5px;line-height:1.45}
.log time{font-family:var(--mono);font-size:12px;color:var(--text3);padding-top:1px}
.log b{font-weight:600}
.assist{display:grid;gap:14px;padding:18px 24px 24px;max-height:640px;overflow-y:auto}
.msg{display:grid;gap:4px}
.msg .who{font-size:12.5px;font-weight:600;color:var(--purple);display:flex;gap:8px;align-items:center}
.msg .who time{font-family:var(--mono);font-weight:400;color:var(--text3)}
.msg p{font-size:14px;line-height:1.5}
.assist .note{font-size:12.5px;color:var(--text3);border-top:1px solid var(--border);padding-top:12px}

/* evidence links */
.cite{background:none;border:0;padding:0;font:400 12.5px/1.5 var(--mono);color:var(--link);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-align:left}
.cite:hover{text-decoration-style:solid}
.cites{display:inline-flex;flex-wrap:wrap;gap:2px 14px;vertical-align:baseline}
.ckres .cites{margin-left:6px}
.finds .cites{margin-top:4px;display:flex}
.pill.q{background:transparent;color:var(--text3);font-weight:500;padding:0 2px}
.step .wb{font-size:11.5px;font-weight:600;background:var(--purple);color:var(--bg);padding:2px 8px;border-radius:999px}
.evc .open{margin-top:2px}

/* record (main column) */
.recsec{margin-top:44px;border-top:1px solid var(--border);padding-top:24px;scroll-margin-top:16px}
.recsec .sech h2{font-size:18px}
.record{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--border)}
.record li{display:grid;grid-template-columns:30px 66px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;line-height:1.55}
.record .ln,.record time{font:400 12px/1.8 var(--mono);color:var(--text3)}
.record .ln{text-align:right}
.record .who{font:600 11.5px/1 var(--mono);letter-spacing:.06em;margin-right:6px}
.tag{font:700 11px/1 var(--sans);letter-spacing:.06em;margin-right:6px;white-space:nowrap}
.tag.pass{color:var(--green)} .tag.flag{color:var(--amber)} .tag.wait,.tag.rule{color:var(--purple)}
.record .cites{margin-left:8px}
.recnote{font-size:13px;color:var(--text3)}
.pnote{font-size:14px;color:var(--text2)}

/* document drawer */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(800px,100%);z-index:50;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 12px;background:var(--bg)}
.dh .fn{font:500 14px/1.4 var(--mono);color:var(--text);word-break:break-all}
.dh .m{font-size:13px;color:var(--text2);margin-top:2px}
.dtabs{display:flex;gap:6px;padding:0 22px 12px;background:var(--bg);border-bottom:1px solid var(--border);overflow-x:auto}
.dtab{flex:none;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--bg);font-size:13.5px;font-weight:500;color:var(--text2);cursor:pointer}
.dtab[aria-selected="true"]{border:1.5px solid var(--text);color:var(--text)}
.db{flex:1;overflow-y:auto;padding:18px 22px 48px;display:grid;gap:16px;align-content:start}
.db .hint{font-size:13px;color:var(--text3)}
.dpg{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:6px 0 10px}
.dpg header{display:flex;justify-content:space-between;padding:10px 18px 4px;font:500 12px/1 var(--mono);color:var(--text3)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;padding:0 18px 0 6px}
.dtext{padding:7px 12px;font-size:15px;line-height:1.7;border-radius:6px;scroll-margin:120px}
.dtext .sec{font:500 12px/1 var(--mono);color:var(--text3);margin-right:6px}
.dtext.focus{background:var(--lav);box-shadow:inset 3px 0 0 var(--purple)}
.dtext mark{background:var(--hl);color:var(--text);padding:0 2px;border-radius:3px}
.dtext mark.bad{text-decoration:underline wavy var(--amber);text-decoration-thickness:1.5px;text-underline-offset:5px;text-decoration-skip-ink:none}
.dnotes{display:grid;gap:10px;align-content:start;padding-top:8px}
.dnote{border-left:2px solid var(--border);padding:1px 0 2px 10px;font-size:13px;line-height:1.5;color:var(--text2)}
.dnote .hd{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.dnote.pass{border-color:var(--green)} .dnote.pass .hd{color:var(--green)}
.dnote.flag{border-color:var(--amber)} .dnote.flag .hd{color:var(--amber)}
.dnote.wait,.dnote.ruled{border-color:var(--purple)} .dnote.wait .hd,.dnote.ruled .hd{color:var(--purple)}
.dnote.running{border-style:dashed}
.dnote .btn{margin-top:8px}
.locked{background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:28px 22px;display:grid;gap:8px;justify-items:start}
.locked .ico{color:var(--amber)}
.locked b{font-size:16px}

/* ---------- scripted data ---------- */
const REVIEWER='Sam Ortega';

const SEV={High:0,Medium:1,Low:2};
function buildDraft(s){
  const r6=s.rulings[6]&&s.rulings[6].v, r8=s.rulings[8]&&s.rulings[8].v;
  const F=[],open=[],cond=[];
  F.push({sev:'Medium',t:'Breach notification SLA is 7 days',d:'Our standard is 72 hours for Confidential data.',c:['q-ir03']});
  cond.push('Amend the DPA to require breach notification within 72 hours.');
  if(r6==='r30'){F.push({sev:'High',t:'Backup retention below 35-day minimum',d:'You ruled the questionnaire’s 30 days is current.',c:['q-dr04','s-cc65']});cond.push('Extend backup retention to at least 35 days and confirm in writing.');}
  if(r6==='r90'){F.push({sev:'Low',t:'Questionnaire misstates backup retention',d:'You ruled the audited 90 days is correct; Q-DR-04 says 30.',c:['q-dr04','s-cc65']});cond.push('Correct questionnaire Q-DR-04 to state 90-day retention.');}
